name: Deploy Minecraft Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "🚀 Начинаем деплой..."
            cd /root/minecraft-bot
            
            echo "📊 Текущий статус репозитория:"
            git status
            
            echo "🧹 Очищаем неотслеживаемые файлы (кроме .env)..."
            git clean -fd -e .env -e .env.* -e *.env
            
            echo "🔄 Сброс локальных изменений..."
            git reset --hard HEAD
            
            echo "📁 Забираем последние изменения из main..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Проверяем структуру файлов..."
            ls -la
            echo "📂 Проверяем core/bot/..."
            ls -la core/bot/ || echo "⚠️ Папка core/bot не найдена"
            echo "📂 Проверяем core/bot/commands/..."
            ls -la core/bot/commands/ || echo "⚠️ Папка core/bot/commands не найдена"
            
            echo "🐍 Проверяем Python зависимости..."
            /usr/bin/python3 -m pip install -q -r requirements.txt
            
            echo "🔄 Перезапускаем сервис..."
            if systemctl restart minecraft-bot.service; then
              echo "✅ Сервис успешно перезапущен"
              sleep 3
              systemctl status minecraft-bot.service --no-pager
            else
              echo "❌ Ошибка при перезапуске сервиса"
              echo "📋 Логи сервиса:"
              journalctl -u minecraft-bot.service -n 50 --no-pager
              exit 1
            fi
            
            echo "✅ Деплой завершен успешно!"